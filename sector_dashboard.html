<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>섹터 밸류에이션 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<script src="sector_data.js"></script>
<script src="sector_series.js"></script>
<script src="sector_supply.js"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
:root{--bg:#f1f5f9;--bg2:#fff;--bg3:#f8fafc;--border:#94a3b8;--border2:#cbd5e1;
  --text1:#1e293b;--text2:#334155;--text3:#64748b;--text4:#94a3b8;--navy:#1e3a8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text1);padding:12px;font-size:12px;}
.header{background:var(--navy);color:#fff;padding:8px 16px;border-radius:4px;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.header-title{font-size:13px;font-weight:700;}
.header-date{font-size:11px;color:#bfdbfe;font-weight:600;}
.insight-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:4px;
  padding:10px 16px;margin-bottom:10px;font-size:13px;line-height:1.9;color:#1e3a8a;}
.section-card{background:var(--bg2);border:1px solid var(--border);border-radius:4px;
  padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:10px;}
.section-title{color:var(--navy);font-weight:700;font-size:11px;
  border-bottom:2px solid var(--navy);padding-bottom:4px;margin-bottom:10px;}
.criteria-box{background:#fefce8;border:1px solid #fde047;border-radius:4px;
  padding:5px 12px;margin-bottom:8px;font-size:10px;color:#713f12;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.cdot{width:10px;height:10px;border-radius:2px;display:inline-block;
  vertical-align:middle;margin-right:2px;}
.group-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
.gtab{font-size:11px;padding:3px 14px;border-radius:20px;cursor:pointer;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text3);}
.gtab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}

@media(max-width:1100px){.card-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:750px){.card-grid{grid-template-columns:repeat(2,1fr);}}
.s-card{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
  padding:12px;cursor:pointer;transition:box-shadow .18s,transform .18s;}
.s-card:hover{box-shadow:0 2px 8px rgba(30,58,138,.14);transform:translateY(-1px);}
.s-card.active{outline:2px solid var(--navy);outline-offset:-1px;
  box-shadow:0 3px 12px rgba(30,58,138,.2);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.card-name{font-size:11px;font-weight:700;color:var(--text2);line-height:1.3;}
.card-signal{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;}
.card-vals{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px;}
.val-block{border-radius:6px;padding:7px 8px;}
.val-block .metric{font-size:9px;font-weight:600;color:rgba(255,255,255,.8);margin-bottom:2px;}
.val-block .num{font-size:19px;font-weight:700;color:#fff;line-height:1;}
.val-block .zval{font-size:10px;color:rgba(255,255,255,.85);margin-top:2px;}
.gauge-wrap{margin-bottom:8px;}
.gauge-lbl{display:flex;justify-content:space-between;font-size:9px;color:var(--text4);margin-bottom:2px;}
.gauge-track{height:6px;background:#e2e8f0;border-radius:3px;position:relative;overflow:hidden;}
.gauge-mark{position:absolute;top:0;left:50%;width:1px;height:100%;background:var(--border);z-index:1;}
.gauge-fill{position:absolute;top:0;left:0;height:100%;border-radius:3px;}
.reps-wrap{display:flex;flex-wrap:wrap;gap:3px;}
.rep-chip{font-size:9px;padding:2px 6px;border-radius:3px;
  border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);}
.rep-chip.inflow{background:#dcfce7;border-color:#16a34a;color:#15803d;font-weight:600;}
.rep-chip.outflow{background:#fee2e2;border-color:#dc2626;color:#b91c1c;font-weight:600;}
.rep-chip.neutral{background:#fef9c3;border-color:#ca8a04;color:#92400e;}
.drawer-box{display:none;background:var(--bg2);border:1.5px solid var(--navy);
  border-radius:8px;padding:14px;margin-top:10px;
  animation:sd .2s ease;}
.drawer-box.open{display:block;}

@keyframes sd{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.drawer-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.drawer-chart-wrap{position:relative;}
.drawer-chart-wrap canvas{height:200px!important;}
.drawer-chart-label{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:4px;}
.drawer-title{font-size:12px;font-weight:700;color:var(--navy);}
.range-tabs{display:flex;gap:3px;}
.rtab{font-size:10px;padding:2px 7px;border-radius:3px;cursor:pointer;
  color:var(--text3);border:1px solid var(--border2);background:var(--bg3);}
.rtab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn-close{font-size:20px;cursor:pointer;color:var(--text3);
  background:none;border:none;padding:0 4px;line-height:1;}
.chart-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:600px){.chart-pair{grid-template-columns:1fr;}}
.chart-panel{background:var(--bg3);border-radius:6px;padding:8px;}
.panel-lbl{font-size:10px;font-weight:700;margin-bottom:4px;
  display:flex;justify-content:space-between;}
.chart-wrap{position:relative;height:160px;}
.chart-wrap canvas{position:absolute;top:0;left:0;
  width:100%!important;height:100%!important;}

/* ── 팝업 모달 ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);z-index:1000;align-items:center;justify-content:center;padding:16px;}
.modal-backdrop.open{display:flex;}
.modal-box{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:860px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:modalIn .2s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #e2e8f0;flex-shrink:0;}
.modal-title{font-size:13px;font-weight:700;}
.modal-ctrl{display:flex;gap:6px;align-items:center;}
.modal-body{padding:14px;overflow-y:auto;flex:1;}
.modal-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.modal-charts{grid-template-columns:1fr;}}
.modal-chart-wrap{position:relative;height:220px;}
.modal-chart-wrap canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important;}
.modal-chart-label{font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px;}
.btn-close-modal{font-size:18px;cursor:pointer;color:#94a3b8;background:none;border:none;padding:0 4px;line-height:1;transition:color .15s;}
.btn-close-modal:hover{color:#1e293b;}
.inline-drawer{display:none;grid-column:1/-1;background:#fff;border:1.5px solid var(--navy);border-radius:8px;padding:14px;animation:sd .2s ease;}
.inline-drawer.open{display:block;}
.view-mode-toggle{display:flex;gap:3px;margin-left:8px;}
.vmt-btn{font-size:10px;padding:2px 8px;border-radius:3px;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text3);}
.vmt-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.caution{font-size:10px;color:var(--text4);border-top:1px solid var(--border2);
  padding-top:5px;margin-top:8px;}
</style>
</head>
<body>
<div class="header">
  <div class="header-title">&#9654; 섹터 밸류에이션 대시보드 &mdash; 25개 섹터 P/E &middot; P/B Z-score</div>
  <div class="header-date" id="base-date">기준일: &mdash;</div>
</div>
<div class="insight-box" id="insight-box">분석 중...</div>
<div class="section-card">
  <div class="section-title">&#9632; 섹터 카드 &mdash; 카드 클릭 시 밴드 추이 펼침</div>
  <div class="criteria-box">
    <strong>Z-score 기준 (2019년 이후 평균 대비)</strong>
    <span><span class="cdot" style="background:#1d4ed8"></span>Z&#8804;&minus;2 극단저평가</span>
    <span><span class="cdot" style="background:#3b82f6"></span>저평가</span>
    <span><span class="cdot" style="background:#64748b"></span>적정</span>
    <span><span class="cdot" style="background:#f59e0b"></span>고평가</span>
    <span><span class="cdot" style="background:#dc2626"></span>Z&#8805;+2 극단과열</span>
    <span>&#124; 대표종목:
      <span style="background:#dcfce7;border:0.5px solid #16a34a;color:#15803d;padding:1px 5px;border-radius:3px;">수급유입</span>
      <span style="background:#fee2e2;border:0.5px solid #dc2626;color:#b91c1c;padding:1px 5px;border-radius:3px;">수급유출</span>
      (추후 연동)
    </span>
  </div>
  <div style="display:flex;align-items:center;margin-bottom:8px;gap:6px;">
    <span style="font-size:10px;color:#64748b;font-weight:600;">차트 표시 방식:</span>
    <div class="view-mode-toggle">
      <button class="vmt-btn active" id="vmt-popup" onclick="setViewMode('popup')">🔲 팝업</button>
      <button class="vmt-btn" id="vmt-inline" onclick="setViewMode('inline')">⬇ 카드 아래</button>
    </div>
  </div>
  <div class="group-tabs" id="group-tabs">
    <div class="gtab active" data-group="all">전체 (25)</div>
    <div class="gtab" data-group="kospi_size">코스피 규모별</div>
    <div class="gtab" data-group="kospi_sector">코스피 업종별</div>
    <div class="gtab" data-group="kosdaq">코스닥</div>
  </div>
  <!-- 카드 그리드 --><div class="card-grid" id="card-grid"></div></div>
  
  <div class="caution">&#10071; Z-score = (현재 &minus; 2019년 이후 평균) &#247; 표준편차 &nbsp;|&nbsp; Fwd.12M 컨센서스 (QuantiWise)</div>
</div>

<div class="modal-backdrop" id="modal-backdrop" onclick="onBackdropClick(event)">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-ctrl">
        <div class="range-tabs" id="modal-range-tabs">
          <button class="rtab active" onclick="setRange('전체','modal')">전체</button>
          <button class="rtab" onclick="setRange('3년','modal')">3년</button>
          <button class="rtab" onclick="setRange('1년','modal')">1년</button>
        </div>
        <button class="btn-close-modal" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-charts">
        <div><div class="modal-chart-label">Fwd P/E 밴드</div><div class="modal-chart-wrap"><canvas id="mc-pe"></canvas></div></div>
        <div><div class="modal-chart-label">Fwd P/B 밴드</div><div class="modal-chart-wrap"><canvas id="mc-pb"></canvas></div></div>
      </div>
    </div>
  </div>
</div>

function zBg(z){
  if(z<=-2)return'#1d4ed8'; if(z<=-1)return'#3b82f6';
  if(z<=1) return'#64748b'; if(z<=2) return'#f59e0b'; return'#dc2626';
}
function zLbl(z){
  if(z<=-2)return'극단저평가'; if(z<=-1)return'저평가';
  if(z<=1) return'적정';      if(z<=2) return'고평가'; return'극단과열';
}
function fmtZ(z){ return (z>=0?'+':'')+z; }
function zGauge(z){ return Math.round((Math.max(-3,Math.min(3,z))+3)/6*100); }

/* 인사이트 — 밸류에이션 + 수급 결합 자동 생성 */
(function(){
  var sv  = Object.values(sectors);
  var byZ = sv.slice().sort(function(a,b){return a.current.pe_z-b.current.pe_z;});
  var excl = {'IKS900':1,'IKQ001':1,'IKS027':1};

  /* ── 밸류에이션 ── */
  var cheap3 = byZ.slice(0,3);
  var hot3   = byZ.slice(-3).reverse();
  var div    = sv.filter(function(s){return s.current.pe_z<=-1 && s.current.pb_z>=2;});

  /* ── 수급 결합 ── */
  var hasSup = (typeof sectorSupply !== 'undefined');
  var best=[], worst=[], sell3=[], buy3=[];
  if(hasSup){
    var sup = sectorSupply.sectors;
    var fore20list = sv
      .filter(function(s){return !excl[s.code] && sup[s.code];})
      .map(function(s){
        return {name:s.name, code:s.code,
          pe_z:s.current.pe_z, pb_z:s.current.pb_z,
          fore20: sup[s.code].summary.d20.fore,
          inst20: sup[s.code].summary.d20.inst,
          fore_sig: sup[s.code].summary.signal.fore,
          inst_sig: sup[s.code].summary.signal.inst};
      });

    fore20list.sort(function(a,b){return a.fore20-b.fore20;});
    sell3 = fore20list.slice(0,3);
    buy3  = fore20list.slice(-3).reverse();

    /* 저평가(PE Z≤-0.5) + 외국인 유입 = 매수 관심 */
    best = fore20list.filter(function(s){
      return s.pe_z <= -0.5 && s.fore_sig==='inflow';
    }).sort(function(a,b){return a.pe_z-b.pe_z;}).slice(0,3);

    /* 과열(PE Z≥1.5) + 외국인 유출 = 주의 */
    worst = fore20list.filter(function(s){
      return s.pe_z >= 1.5 && s.fore_sig==='outflow';
    }).sort(function(a,b){return b.pe_z-a.pe_z;}).slice(0,3);
  }

  /* ── HTML 조립 ── */
  function row(icon, label, content){
    return '<div style="margin-bottom:3px;">'+icon+' <strong>'+label+'</strong> '+content+'</div>';
  }
  function secName(s){ return '<strong>'+s.name+'</strong>'; }
  function fmtBn(v){
    var a=Math.abs(v),sg=v>=0?'+':'-';
    return sg+(a>=10000?(a/10000).toFixed(1)+'조':(a).toLocaleString()+'억');
  }

  var t = '';

  /* 밸류에이션 라인 */
  t += row('&#128200;','PE 저평가 TOP3:',
    cheap3.map(function(s){return secName(s)+'(Z='+fmtZ(s.current.pe_z)+')'}).join(', '));
  t += row('&#9651;','PE 과열 TOP3:',
    hot3.map(function(s){return secName(s)+'(Z='+fmtZ(s.current.pe_z)+')'}).join(', '));

  if(div.length){
    t += row('&#9888;','PE↓ PB↑ 괴리 주목:',
      div.map(function(s){
        return secName(s)+'(PE Z='+fmtZ(s.current.pe_z)+' / PB Z='+fmtZ(s.current.pb_z)+')';
      }).join(', ')+
      ' &mdash; <span style="color:#1d4ed8;">이익 대비 자산가치 선반영. 구조적 리레이팅 가능성 vs 버블 경계 확인 필요</span>');
  }

  /* 수급 라인 */
  if(hasSup){
    t += row('&#128199;','외국인 20일 순매도:',
      sell3.map(function(s){
        return secName(s)+'(<span style="color:#b91c1c;">'+fmtBn(s.fore20)+'</span>)';
      }).join(', '));
    t += row('&#128200;','외국인 20일 순매수:',
      buy3.map(function(s){
        return secName(s)+'(<span style="color:#15803d;">'+fmtBn(s.fore20)+'</span>)';
      }).join(', '));

    /* 결합 인사이트 */
    if(best.length){
      t += row('&#9989;','저평가+수급유입 주목 섹터:',
        '<span style="color:#15803d;">'+
        best.map(function(s){
          return secName(s)+'(PE Z='+fmtZ(s.pe_z)+' / 외국인 '+fmtBn(s.fore20)+')';
        }).join(', ')+'</span>');
    }
    if(worst.length){
      t += row('&#9888;','과열+수급유출 주의 섹터:',
        '<span style="color:#b91c1c;">'+
        worst.map(function(s){
          return secName(s)+'(PE Z='+fmtZ(s.pe_z)+' / 외국인 '+fmtBn(s.fore20)+')';
        }).join(', ')+'</span>');
    }
  }

  document.getElementById('insight-box').innerHTML = t;
})();

/* ── 수급 신호 자동 반영 (sector_supply.js 로드 후) ── */
(function applySupply(){
  if(typeof sectorSupply === 'undefined') return;
  var ss = sectorSupply.sectors;

  Object.keys(ss).forEach(function(code){
    var sup = ss[code];
    var foreSig = sup.summary.signal.fore;
    var instSig = sup.summary.signal.inst;
    var f20 = sup.summary.d20.fore;
    var i20 = sup.summary.d20.inst;

    /* 카드 상단에 수급 배지 추가 */
    var card = document.getElementById('card-'+code);
    if(!card) return;

    var badge = document.createElement('div');
    badge.style.cssText =
      'display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;';

    function mkBadge(label, val, sig){
      var span = document.createElement('span');
      var bg = sig==='inflow'?'#dcfce7':sig==='outflow'?'#fee2e2':'#f1f5f9';
      var col= sig==='inflow'?'#15803d':sig==='outflow'?'#b91c1c':'#64748b';
      var arr= sig==='inflow'?'▲':sig==='outflow'?'▼':'–';
      span.style.cssText = 'font-size:9px;padding:2px 6px;border-radius:3px;'+
        'background:'+bg+';color:'+col+';font-weight:600;';
      var absVal = Math.abs(val);
      var disp = absVal>=10000?(absVal/10000).toFixed(1)+'조':(absVal/1000).toFixed(0)+'천억';
      span.textContent = label+' '+arr+disp;
      return span;
    }
    var iv20 = sup.summary.d20.indv;
    var indvSig = sup.summary.signal.indv;
    badge.appendChild(mkBadge('외국인', f20,  foreSig));
    badge.appendChild(mkBadge('기관',   i20,  instSig));
    badge.appendChild(mkBadge('개인',   iv20, indvSig));
    card.appendChild(badge);
  });
})();

function closeInlineDrawer(){
  if(inlineDrawerCode){var c=document.getElementById('card-'+inlineDrawerCode);if(c)c.classList.remove('active');}
  ['pe','pb'].forEach(function(k){var ch=CHARTS['i_'+k];if(ch){ch.destroy();delete CHARTS['i_'+k];}});
  var old=document.querySelector('.inline-drawer'); if(old)old.remove();
  inlineDrawerCode=null;
}
function toggleDrawer(code,card){
  if(viewMode==='popup'){
    if(activeCode===code){closeModal();return;}
    if(activeCode){var prev=document.getElementById('card-'+activeCode);if(prev)prev.classList.remove('active');}
    activeCode=code; card.classList.add('active'); openModal(code);
  } else {
    if(inlineDrawerCode===code){closeInlineDrawer();return;}
    openInlineDrawer(code,card); activeCode=code;
  }
}
function closeAll(){closeModal();closeInlineDrawer();}
function closeDrawer(){closeAll();}

}
function makeDataset(code,key){
  var ser=(typeof sectorSeries!=='undefined')?sectorSeries[code]:[];
  return {labels:ser.map(function(r){return r.d;}),data:ser.map(function(r){return r[key];})};
}
function drawModalChart(code,key,stats,col){
  var lineCol=(key==='pb')?'#7c3aed':col,cv=document.getElementById('mc-'+key);
  if(!cv) return;
  var d=makeDataset(code,key);
  MODAL_CHARTS[key]=new Chart(cv,{type:'line',data:{labels:d.labels,datasets:[{data:d.data,borderColor:lineCol,borderWidth:1.8,pointRadius:0,tension:0.3,fill:false,spanGaps:false}]},options:makeChartOpts(code,key,stats)});
}
function drawInlineChart(code,key,stats,col){
  var lineCol=(key==='pb')?'#7c3aed':col,cv=document.getElementById('idc-'+key);
  if(!cv) return;
  var d=makeDataset(code,key);
  CHARTS['i_'+key]=new Chart(cv,{type:'line',data:{labels:d.labels,datasets:[{data:d.data,borderColor:lineCol,borderWidth:1.8,pointRadius:0,tension:0.3,fill:false,spanGaps:false}]},options:makeChartOpts(code,key,stats)});
}
function drawChart(code,key,stats,col){
  if(viewMode==='popup') drawModalChart(code,key,stats,col);
  else drawInlineChart(code,key,stats,col);
}

function setRange(range,target){
  var code=(target==='inline')?inlineDrawerCode:activeCode;
  if(!code) return;
  var ser=(typeof sectorSeries!=='undefined')?sectorSeries[code]:[];
  var base=new Date(LIGHT.base_date);
  var from=(range==='전체'||range==='all')?new Date('2019-01-01')
    :(range==='3년'||range==='3y')?new Date(base.getFullYear()-3,base.getMonth(),base.getDate())
    :new Date(base.getFullYear()-1,base.getMonth(),base.getDate());
  var tabContainer=(target==='inline')?document.querySelector('#idr-'+code+' .range-tabs'):document.getElementById('modal-range-tabs');
  if(tabContainer){tabContainer.querySelectorAll('.rtab').forEach(function(t){t.classList.toggle('active',t.textContent===range);});}
  var chartMap=(target==='inline')?{pe:CHARTS['i_pe'],pb:CHARTS['i_pb']}:{pe:MODAL_CHARTS['pe'],pb:MODAL_CHARTS['pb']};
  ['pe','pb'].forEach(function(key){
    var ch=chartMap[key]; if(!ch) return;
    var f=ser.filter(function(r){return new Date(r.d)>=from;});
    ch.data.labels=f.map(function(r){return r.d;}); ch.data.datasets[0].data=f.map(function(r){return r[key];}); ch.update();
  });
}

window.highlightReps = function(map){
  document.querySelectorAll('.rep-chip').forEach(function(chip){
    chip.className='rep-chip';
    if(map[chip.dataset.rep]) chip.classList.add(map[chip.dataset.rep]);
  });
};

</script>
